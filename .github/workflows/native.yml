name: Native ARM64 components

# Builds the pieces the native ARM64 WoW client needs and publishes them as a pre-release
# ("native-<component>-<version>"). Pre-releases never show up in the in-app updater.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native.yml']

permissions:
  contents: write

jobs:
  dxvk-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: cat native/versions.properties | grep -v '^#' >> "$GITHUB_ENV"

      - name: Toolchain (llvm-mingw ${{ env.LLVM_MINGW }})
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ninja-build glslang-tools
          pip3 install --quiet meson
          f="llvm-mingw-${LLVM_MINGW}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW}/$f" -o "$RUNNER_TEMP/$f"
          tar -xf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${f%.tar.xz}/bin" >> "$GITHUB_PATH"

      - name: DXVK source (${{ env.DXVK_REF }})
        run: git clone --depth 1 --recursive --shallow-submodules -b "$DXVK_REF" https://github.com/doitsujin/dxvk.git "$RUNNER_TEMP/dxvk"

      - name: Build for plain ARM64 (aarch64-w64-mingw32)
        run: |
          cd "$RUNNER_TEMP/dxvk"
          meson setup --cross-file "$GITHUB_WORKSPACE/native/dxvk/cross-aarch64.txt" --buildtype release build
          ninja -C build
          mkdir -p "$RUNNER_TEMP/out/system32"
          find build -name '*.dll' -exec cp {} "$RUNNER_TEMP/out/system32/" \;
          ls -la "$RUNNER_TEMP/out/system32"

      - name: Check machine type is ARM64 (0xAA64)
        run: |
          python3 - "$RUNNER_TEMP/out/system32" <<'PY'
          import os, struct, sys
          d = sys.argv[1]
          for n in sorted(os.listdir(d)):
              b = open(os.path.join(d, n), 'rb').read(4096)
              pe = struct.unpack_from('<I', b, 0x3c)[0]
              machine = struct.unpack_from('<H', b, pe + 4)[0]
              print(n, hex(machine))
              assert machine == 0xAA64, f"{n} is not plain ARM64"
          PY

      - name: Package
        run: |
          cd "$RUNNER_TEMP/out"
          tar -cJf "$GITHUB_WORKSPACE/dxvk-arm64-${DXVK_REF}.tar.xz" system32
          sha256sum "$GITHUB_WORKSPACE/dxvk-arm64-${DXVK_REF}.tar.xz" | tee "$GITHUB_WORKSPACE/dxvk-arm64-${DXVK_REF}.tar.xz.sha256"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="native-dxvk-arm64-${DXVK_REF}"
          gh release view "$tag" >/dev/null 2>&1 && gh release delete "$tag" --yes --cleanup-tag
          gh release create "$tag" dxvk-arm64-*.tar.xz* --prerelease --target "$GITHUB_SHA" \
            --title "DXVK ${DXVK_REF} for plain ARM64 Windows" \
            --notes "Upstream DXVK ${DXVK_REF}, cross-compiled with llvm-mingw ${LLVM_MINGW} for aarch64-w64-mingw32. For Blizzard's native ARM64 WoW client. Unmodified."

  fex-bridges:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: cat native/versions.properties | grep -v '^#' >> "$GITHUB_ENV"

      - name: Toolchain (bylaws llvm-mingw ${{ env.BYLAWS_LLVM_MINGW }})
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ninja-build cmake
          f="llvm-mingw-${BYLAWS_LLVM_MINGW}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -fsSL "https://github.com/bylaws/llvm-mingw/releases/download/${BYLAWS_LLVM_MINGW}/$f" -o "$RUNNER_TEMP/$f"
          tar -xf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${f%.tar.xz}/bin" >> "$GITHUB_PATH"

      - name: FEX source (${{ env.FEX_REF }})
        run: |
          git init -q "$RUNNER_TEMP/fex" && cd "$RUNNER_TEMP/fex"
          git remote add origin https://github.com/FEX-Emu/FEX
          git fetch -q --depth 1 origin "$FEX_REF" && git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 --recursive

      - name: Build wow64 + arm64ec bridges
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/fex"
          for target in wow64 arm64ec; do
            case $target in wow64) cc=aarch64 ;; arm64ec) cc=arm64ec ;; esac
            cmake -S . -B build_$target -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=Data/CMake/toolchain_mingw.cmake -DMINGW_TRIPLE=${cc}-w64-mingw32 \
              -DCMAKE_INSTALL_LIBDIR=/usr/lib/wine/aarch64-windows -DCMAKE_INSTALL_PREFIX=/usr \
              -DENABLE_LTO=False -DENABLE_ASSERTIONS=False -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
              -DBUILD_TESTING=False -DTUNE_ARCH=generic -DTUNE_CPU=none 2>&1 | tee -a "$GITHUB_WORKSPACE/fex.log"
            cmake --build build_$target 2>&1 | tee -a "$GITHUB_WORKSPACE/fex.log"
            DESTDIR="$PWD/install" cmake --build build_$target -t install 2>&1 | tee -a "$GITHUB_WORKSPACE/fex.log"
          done
          ls -la install/usr/lib/wine/aarch64-windows/

      - name: Surface build errors
        if: failure()
        run: |
          annotate() { python3 -c 'import sys; t=sys.stdin.read()[-30000:]; print("::error title=%s::" % sys.argv[1] + t.replace("%","%25").replace("\r","").replace("\n","%0A"))' "$1"; }
          grep -E -B2 -A4 'error:|Error|FAILED|CMake Error' fex.log | head -120 | annotate "fex errors" || true
          tail -60 fex.log | annotate "fex tail" || true

      - name: Package as engine content (.wcp)
        run: |
          out="$RUNNER_TEMP/wcp" && mkdir -p "$out/system32"
          cp "$RUNNER_TEMP"/fex/install/usr/lib/wine/aarch64-windows/libwow64fex.dll "$out/system32/"
          cp "$RUNNER_TEMP"/fex/install/usr/lib/wine/aarch64-windows/libarm64ecfex.dll "$out/system32/"
          cat > "$out/profile.json" <<JSON
          {
            "type": "FEXCore",
            "versionName": "${FEX_NAME}",
            "versionCode": 0,
            "description": "FEX ${FEX_REF} (Azeroid CI build)",
            "files": [
              { "source": "system32/libarm64ecfex.dll", "target": "\${system32}/libarm64ecfex.dll" },
              { "source": "system32/libwow64fex.dll", "target": "\${system32}/libwow64fex.dll" }
            ]
          }
          JSON
          cat "$out/profile.json"
          tar -C "$out" -cJf "$GITHUB_WORKSPACE/fexcore-${FEX_NAME}.wcp" profile.json system32
          sha256sum "$GITHUB_WORKSPACE/fexcore-${FEX_NAME}.wcp" | tee "$GITHUB_WORKSPACE/fexcore-${FEX_NAME}.wcp.sha256"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="native-fex-${FEX_NAME}"
          gh release view "$tag" >/dev/null 2>&1 && gh release delete "$tag" --yes --cleanup-tag
          gh release create "$tag" fexcore-*.wcp* --prerelease --target "$GITHUB_SHA" \
            --title "FEX ${FEX_NAME} (${FEX_REF:0:7}) Wine bridges" \
            --notes "FEX-Emu at ${FEX_REF}, built for Wine ARM64EC/WoW64 with bylaws llvm-mingw ${BYLAWS_LLVM_MINGW}. Unmodified."
