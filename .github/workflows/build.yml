name: Build

# Every push/PR builds an APK (downloadable from the run's artifacts).
# When a push to main carries a VERSION that has no release yet, the APK is
# signed with the release key and published as GitHub Release v<VERSION> —
# which is what the app's updater picks up.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AZEROID_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must look like 1.2.3"; exit 1; }
          release=false
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]] && ! gh release view "v$v" >/dev/null 2>&1; then
            release=true
          fi
          [[ "$release" == true ]] || v="0.0.0"   # non-release builds never trigger the in-app updater
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "AZEROID_VERSION=$v" >> "$GITHUB_ENV"
          echo "::notice title=Version::$v (release=$release)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Native build tools
        run: sudo apt-get update -q && sudo apt-get install -yq glslang-tools ninja-build zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-${{ hashFiles('engine.properties') }}

      - name: Prepare engine + Azeroid overlay
        run: ./scripts/prepare-engine.sh

      - name: Release signing key
        if: steps.version.outputs.release == 'true'
        env:
          SIGNING_PASSWORD: ${{ secrets.AZEROID_SIGNING_PASSWORD }}
        run: |
          [ -n "$SIGNING_PASSWORD" ] || { echo "::error::AZEROID_SIGNING_PASSWORD secret missing — see docs/RELEASING.md"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/azeroid-release.jks.enc \
            -out "$RUNNER_TEMP/azeroid.jks" -pass env:SIGNING_PASSWORD
          {
            echo "AZEROID_KEYSTORE_FILE=$RUNNER_TEMP/azeroid.jks"
            echo "AZEROID_KEYSTORE_PASSWORD=$SIGNING_PASSWORD"
            echo "AZEROID_KEY_ALIAS=azeroid"
            echo "AZEROID_KEY_PASSWORD=$SIGNING_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: engine
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-configuration-cache 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Surface build errors
        if: failure()
        run: |
          # Errors as multi-line annotations, so failures are readable from the checks API.
          annotate() { python3 -c 'import sys; t=sys.stdin.read()[-30000:]; print("::error title=%s::" % sys.argv[1] + t.replace("%","%25").replace("\r","").replace("\n","%0A"))' "$1"; }
          grep -E -A3 '^e: |error:|ERROR:|\* What went wrong|Exception:' build.log | head -150 | annotate "errors" || true
          tail -80 build.log | annotate "log tail" || true

      - name: Collect APK
        run: |
          apk="$(find engine/app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$apk"
          mkdir -p dist
          cp "$apk" "dist/Azeroid-${{ steps.version.outputs.version }}.apk"
          sha256sum dist/*.apk

      - name: Verify APK
        run: |
          apk="$(ls dist/*.apk)"
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          badging="$("$aapt2" dump badging "$apk" | grep -E "^(package|launchable-activity|application-label):")"
          echo "$badging"
          echo "$badging" | grep -q "name='com.azeroid.app'"
          echo "$badging" | grep -q "launchable-activity: name='com.azeroid.app.AzeroidActivity'"
          unzip -p "$apk" 'classes*.dex' | grep -aq 'Lcom/azeroid/app/engine/Engine;'
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            signer="$("$(dirname "$aapt2")/apksigner" verify --print-certs "$apk" | grep 'SHA-256')"
            echo "$signer"
          fi
          echo "::notice title=APK::$(echo "$badging" | tr '\n' ' ') size=$(du -m "$apk" | cut -f1)MB"

      - uses: actions/upload-artifact@v4
        with:
          name: Azeroid-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Release notes = this version's section of CHANGELOG.md
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Azeroid $VERSION" > notes.md
          gh release create "v$VERSION" dist/*.apk --target "$GITHUB_SHA" --title "Azeroid $VERSION" --notes-file notes.md
