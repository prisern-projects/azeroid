name: Battle.net bench

# Starts Battle.net under Wine ARM64EC + FEX (Hangover) on an ARM64 Linux runner and publishes screenshots
# and logs as the pre-release "bench-latest". Lets us iterate on Battle.net without a phone.
on:
  workflow_dispatch:
    inputs:
      bnet_hodll: { description: 'Translator DLL for Battle.net', default: 'libwow64fex.dll' }
      bnet_args: { description: 'Battle.net arguments', default: '--disable-gpu --enable-features=NetworkServiceInProcess2' }
      winedebug: { description: 'WINEDEBUG', default: 'fixme-all' }
      hangover: { description: 'Hangover release tag', default: 'hangover-10.18' }
  push:
    branches: [main]
    paths: ['bench/**', '.github/workflows/bench.yml']

permissions:
  contents: write

jobs:
  battlenet:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: azeroid, args: '--disable-gpu --enable-features=NetworkServiceInProcess2' }
    env:
      GH_TOKEN: ${{ github.token }}
      BNET_HODLL: ${{ inputs.bnet_hodll || 'libwow64fex.dll' }}
      BNET_ARGS: ${{ matrix.variant.args }}
      WINEDEBUG: ${{ inputs.winedebug || 'fixme-all,+loaddll' }}
      HANGOVER_TAG: ${{ inputs.hangover || 'hangover-10.18' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine (GE-Proton 10 source build) + Azeroid's FEX
        run: |
          set -e
          sudo apt-get update -q
          sudo apt-get install -yq xvfb imagemagick cabextract xdotool mesa-vulkan-drivers libvulkan1 libegl1 libgl1 libgles2 \
            libfreetype6 libfontconfig1 libgnutls30t64 libxrender1 libxrandr2 libxi6 libxcursor1 libxcomposite1 libxinerama1 libxxf86vm1 libpulse0 libasound2t64 libunwind8
          gh release download bench-wine-ge10 -p 'wine-ge10-linux-arm64.tar.xz' -D "$RUNNER_TEMP"
          sudo tar -xJf "$RUNNER_TEMP/wine-ge10-linux-arm64.tar.xz" -C /
          gh release download native-fex-2601-116 -p 'fexcore-2601-116.wcp' -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/fex" && tar -xJf "$RUNNER_TEMP/fexcore-2601-116.wcp" -C "$RUNNER_TEMP/fex"
          sudo cp "$RUNNER_TEMP"/fex/system32/lib*fex.dll /opt/wine/lib/wine/aarch64-windows/
          echo "/opt/wine/bin" >> "$GITHUB_PATH"
          /opt/wine/bin/wine --version

      - name: Run bench
        timeout-minutes: 40
        env:
          OUT: ${{ github.workspace }}/bench-out
        run: bench/run-battlenet.sh 2>&1 | tee bench-out-console.log

      - name: Publish results
        if: always()
        run: |
          mkdir -p bench-out && cp bench-out-console.log bench-out/ 2>/dev/null || true
          tar -czf bench-results.tar.gz bench-out
          tag="bench-${{ matrix.variant.name }}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          tail -40 bench-out/progress.txt bench-out-console.log 2>/dev/null | python3 -c 'import sys; print("::notice title=bench console::" + sys.stdin.read()[-20000:].replace("%","%25").replace("\n","%0A"))'
          gh release create "$tag" bench-results.tar.gz --prerelease --target "$GITHUB_SHA" \
            --title "Battle.net bench: ${{ matrix.variant.name }}" --notes "HODLL=$BNET_HODLL ARGS=$BNET_ARGS WINEDEBUG=$WINEDEBUG"
