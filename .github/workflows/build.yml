name: Build

# Every push/PR builds the APK. When main carries a VERSION with no release yet, the APK is signed with the
# Azeroid release key and published as GitHub Release v<VERSION>, which the in-app updater installs.
on:
  push:
    branches: [main]
    paths-ignore: ['bench/**', 'native/**', '.github/workflows/bench*.yml', '.github/workflows/native.yml', 'docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must look like 1.2.3"; exit 1; }
          release=false
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]] && ! gh release view "v$v" >/dev/null 2>&1; then
            release=true
          fi
          [[ "$release" == true ]] || v="0.0.0"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "AZEROID_VERSION=$v" >> "$GITHUB_ENV"
          echo "::notice title=Version::$v (release=$release)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK components
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;22.1.7171670" "cmake;3.22.1" >/dev/null
          echo "sdk.dir=$sdk" > local.properties

      - name: Cache fetched assets
        uses: actions/cache@v4
        with:
          path: out/_cache
          key: assets-${{ hashFiles('scripts/large-assets.json', 'scripts/fetch-wehavephones-wine.py', 'app/src/wehavephones/assets/wehavephones/*.json') }}

      - name: Release signing key
        if: steps.version.outputs.release == 'true'
        env:
          SIGNING_PASSWORD: ${{ secrets.AZEROID_SIGNING_PASSWORD }}
        run: |
          [ -n "$SIGNING_PASSWORD" ] || { echo "::error::AZEROID_SIGNING_PASSWORD secret missing"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/azeroid-release.jks.enc \
            -out "$RUNNER_TEMP/azeroid.jks" -pass env:SIGNING_PASSWORD
          {
            echo "WEHAVEPHONES_KEYSTORE=$RUNNER_TEMP/azeroid.jks"
            echo "WEHAVEPHONES_KEYSTORE_PASS=$SIGNING_PASSWORD"
            echo "WEHAVEPHONES_KEY_ALIAS=azeroid"
            echo "WEHAVEPHONES_KEY_PASS=$SIGNING_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        env:
          WEHAVEPHONES_SIGNING_ENV: /dev/null
        run: |
          set -o pipefail
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            scripts/build-wehavephones.sh --release 2>&1 | tee build.log
          else
            scripts/build-wehavephones.sh 2>&1 | tee build.log
          fi

      - name: Surface build errors
        if: failure()
        run: |
          annotate() { python3 -c 'import sys; t=sys.stdin.read()[-30000:]; print("::error title=%s::" % sys.argv[1] + t.replace("%","%25").replace("\r","").replace("\n","%0A"))' "$1"; }
          grep -E -A3 '^e: |error:|ERROR:|\* What went wrong|Exception:|FAILED' build.log | head -150 | annotate "errors" || true
          tail -80 build.log | annotate "log tail" || true

      - name: Collect + verify APK
        run: |
          mkdir -p dist
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            cp out/release/Azeroid-*.apk dist/
          else
            cp app/build/outputs/apk/wehavephones/debug/app-wehavephones-debug.apk dist/Azeroid-dev.apk
          fi
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          b="$("$aapt2" dump badging dist/*.apk | grep -E "^(package|application-label):")"
          echo "::notice title=APK::$(echo "$b" | tr '\n' ' ') size=$(du -m dist/*.apk | cut -f1)MB"

      - uses: actions/upload-artifact@v4
        with:
          name: Azeroid-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Azeroid $VERSION" > notes.md
          gh release create "v$VERSION" dist/Azeroid-*.apk --target "$GITHUB_SHA" --title "Azeroid $VERSION" --notes-file notes.md
