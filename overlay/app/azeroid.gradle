// Azeroid build settings, applied on top of the engine's app/build.gradle.
//
// Version comes from AZEROID_VERSION (set by CI from the git tag, e.g. "0.3.1").
// versionCode is derived from it so every release installs over the previous one.
def azeroidVersion = System.getenv("AZEROID_VERSION") ?: "0.0.0"
def (vMajor, vMinor, vPatch) = azeroidVersion.tokenize('.').collect { it.replaceAll('[^0-9]', '') as int } + [0, 0, 0]

android {
    defaultConfig {
        applicationId "com.azeroid.app"
        versionName azeroidVersion
        versionCode vMajor * 10000 + vMinor * 100 + vPatch + 1
        buildConfigField "String", "AZEROID_REPO", "\"${System.getenv("AZEROID_REPO") ?: "prisern-projects/azeroid"}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        azeroid {
            def ks = System.getenv("AZEROID_KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("AZEROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("AZEROID_KEY_ALIAS")
                keyPassword System.getenv("AZEROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Without the release key (forks, PR builds) fall back to the debug key;
            // such APKs can't update a real install, which is exactly what we want.
            signingConfig System.getenv("AZEROID_KEYSTORE_FILE") ? signingConfigs.azeroid : signingConfigs.debug
        }
    }
}
