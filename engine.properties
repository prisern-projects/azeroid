# The emulation engine Azeroid is built on (Winlator Bionic, "Ludashi" fork, MIT licensed).
# CI checks out exactly this commit, so builds are reproducible. Bump deliberately.
ENGINE_REPO=https://github.com/StevenMXZ/Winlator-Ludashi
ENGINE_COMMIT=1042ba5d2444900068b14137bf93a4ed6689cdd4

# Native helper libraries the engine's CMake build expects (pinned like upstream CI).
ADRENOTOOLS_REPO=https://github.com/Pipetto-crypto/libadrenotools.git
ADRENOTOOLS_COMMIT=8483dfdaa2abf97ee89ad0e5f337e7b508550c6b
LINKERNSBYPASS_REPO=https://github.com/Pipetto-crypto/liblinkernsbypass.git

# Linux userland (Wine prerequisites) bundled into the APK, verified by SHA-256.
IMAGEFS_URL_PREFIX=https://raw.githubusercontent.com/Other-backup/winlator-imagefs-v2/main/imagefs.tar.zst.
IMAGEFS_PARTS=2
IMAGEFS_SHA256=7838756e6a05c91afff68f4bf12aa2780f815877753f8dd354e203e99b9caf8a
LINKERNSBYPASS_COMMIT=b10d48548d608dfca38ffc449d0350335b2f3737

# Khronos Vulkan validation layer, packaged like the engine's own CI does.
VVL_VERSION=1.4.357.0
VVL_SHA256=daaeac9291167a2d5257a8a0f7c0a86e56d0821d0211af661710fe68c8040ffa
